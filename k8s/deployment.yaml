apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkle-audio
  namespace: sparkle-audio
  labels:
    app.kubernetes.io/name: sparkle-audio
spec:
  # Single replica: SQLite WAL + the in-memory rate limiter are not safe to
  # share across pods. Scaling out requires moving to Postgres + a shared
  # rate-limit store (see README "Scaling").
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkle-audio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkle-audio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: sparkle-audio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: sparkle-audio
            - secretRef:
                name: sparkle-audio
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # The server exposes GET /api/health.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sparkle-audio-data
