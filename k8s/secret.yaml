# Secrets for Sparkle Audio.
#
# DO NOT COMMIT REAL VALUES. Generate them and create the Secret imperatively:
#
#   kubectl -n sparkle-audio create secret generic sparkle-audio \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=REMOVAL_KEY=$(openssl rand -base64 24) \
#     --from-literal=OWNER_PASSWORD=$(openssl rand -base64 18) \
#     --from-literal=OWNER_EMAIL=owner@example.com
#
# Or fill the placeholders below (base64-encoded) and apply this file.
# The JWT_SECRET MUST be shared by every replica — rotating it invalidates all
# sessions and decrypts (breaks) existing TOTP secrets.
apiVersion: v1
kind: Secret
metadata:
  name: sparkle-audio
  namespace: sparkle-audio
  labels:
    app.kubernetes.io/name: sparkle-audio
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_hex_32"
  REMOVAL_KEY: "CHANGE_ME_generate_with_openssl_rand_base64_24"
  OWNER_PASSWORD: "CHANGE_ME_set_a_strong_owner_password"
  OWNER_EMAIL: "owner@example.com"
